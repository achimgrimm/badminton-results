# Weekly dependency updates, one grouped PR per ecosystem. Passing PRs are merged
# automatically by .github/workflows/dependabot-automerge.yml.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
