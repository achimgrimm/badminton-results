name: Dependabot auto-merge

# Tests Dependabot PRs and merges npm minor/patch updates (the "npm-minor-patch" group) when type
# check and tests pass. Major updates and GitHub Actions updates are tested too, but stay open
# for a manual review. A failing PR stays open with a red check.
on: pull_request

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  test-and-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Merge
        if: steps.meta.outputs.dependency-group == 'npm-minor-patch'
        run: gh pr merge "$PR" --squash --delete-branch
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Merges made with GITHUB_TOKEN don't trigger the push workflow, so deploy explicitly.
      - name: Deploy
        if: steps.meta.outputs.dependency-group == 'npm-minor-patch'
        run: gh workflow run update.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
