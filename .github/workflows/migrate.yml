name: Migrate database

# Applies supabase/migrations/ to the Supabase project when main changes them. Branches and test
# stages never run this: there is only one database, and it belongs to the live site.
# Needs the repository secret SUPABASE_DB_URL: the Session pooler connection string (IPv4; the direct
# host is IPv6 only and GitHub runners can't reach it) including the database password.
on:
  push:
    branches: [main, feature/online-backend] # TEMP: first migration from the branch
    paths: ["supabase/**", ".github/workflows/migrate.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db push --db-url "$SUPABASE_DB_URL"
