name: Migrate database

# Applies supabase/migrations/ to the Supabase project when main changes them. Branches and test
# stages never run this: there is only one database, and it belongs to the live site.
# Needs the repository secret SUPABASE_DB_URL: the Session pooler connection string (IPv4; the direct
# host is IPv6 only and GitHub runners can't reach it) including the database password.
on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 3.1.0 # pinned: this job holds the database password; bump by hand
      - run: supabase db push --yes --remote="$SUPABASE_DB_URL"
