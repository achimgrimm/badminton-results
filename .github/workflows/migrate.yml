name: Migrate database

# Applies supabase/migrations/ to the Supabase project when main changes them. Branches and test
# stages never run this: there is only one database, and it belongs to the live site.
# Needs the repository secret SUPABASE_DB_URL: the Session pooler connection string (IPv4; the direct
# host is IPv6 only and GitHub runners can't reach it) including the database password.
on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The CLI is the locked `supabase` devDependency (package-lock.json, no install scripts via
      # .npmrc); Dependabot updates it like any npm package. The password is only set below.
      - run: npm ci
      - run: npx --no-install supabase db push --yes --remote="$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
