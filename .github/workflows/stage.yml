name: Update test stages

# Pushing or deleting a branch changes its test stage (stage/<branch>/). Only main may deploy
# to GitHub Pages, so this just starts the main workflow, which rebuilds the live site and
# every stage from the current branches.
on:
  push:
    branches-ignore: [main, "dependabot/**"]
  delete:

permissions:
  actions: write
  contents: read

jobs:
  redeploy:
    if: ${{ github.event_name == 'push' || (github.event.ref_type == 'branch' && !startsWith(github.event.ref, 'dependabot/')) }}
    runs-on: ubuntu-latest
    steps:
      # A release moves main and deletes the branch in one push; main's push run then already
      # drops the stage, so a second run would only deploy the same site again.
      - run: |
          if [ "$GITHUB_EVENT_NAME" = delete ]; then
            main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -q .sha)
            busy=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/runs?event=push&head_sha=$main" \
              -q '[.workflow_runs[] | select(.status != "completed")] | length')
            if [ "$busy" -gt 0 ]; then echo "main's push run already removes this stage"; exit 0; fi
          fi
          gh workflow run update.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
