name: Update results

# Builds the live site from main and a test stage from every other branch (stage/<branch>/),
# then deploys them together: GitHub Pages holds one site per repo. Runs hourly, on every push
# to main, and when stage.yml asks for it after a branch push or delete.
on:
  schedule:
    - cron: "17 * * * *" # hourly
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  branches:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.list.outputs.sites }}
    steps:
      - uses: actions/checkout@v7
      # main is the live site; every other branch except Dependabot's is a test stage.
      - id: list
        run: |
          sites=$(git ls-remote --heads origin | sed 's|.*refs/heads/||' | grep -v '^dependabot/' | jq -R -s -c '
            split("\n") | map(select(length > 0)) | map(
              if . == "main" then {ref: ., stage: "", name: "live"}
              else (ascii_downcase | gsub("[^a-z0-9]+"; "-") | gsub("^-+|-+$"; "")) as $s
                | select($s != "") | {ref: ., stage: $s, name: ("stage-" + $s)} end) | unique_by(.name)')
          echo "sites=$sites" >> "$GITHUB_OUTPUT"
          echo "$sites" | jq .

  site:
    needs: branches
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.branches.outputs.sites) }}
    name: site (${{ matrix.site.name }})
    env:
      STAGE: ${{ matrix.site.stage }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.site.ref }}
      # Node version comes from mise.toml
      - uses: jdx/mise-action@v4
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # data/ is not in git; it lives in the Actions cache so each run only re-fetches new or
      # unapproved Spielberichte. Each site has its own cache, so a stage that changes the data
      # format can't break live; a new stage starts from live's data.
      - uses: actions/cache/restore@v6
        with:
          path: data
          key: data-${{ matrix.site.name }}-${{ github.run_id }}
          restore-keys: |
            data-${{ matrix.site.name }}-
            data-live-
            data-
      - run: npm run scrape
      - run: npm run build
      # Only reached when scrape and build succeeded, so bad data is never cached.
      - uses: actions/cache/save@v6
        with:
          path: data
          key: data-${{ matrix.site.name }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v5
        with:
          name: site-${{ matrix.site.name }}
          # A stage build writes to dist/stage/<name>/, so its artifact already holds that path.
          path: dist
          include-hidden-files: true
          retention-days: 1

  # A failed stage only misses its folder; if live failed, nothing is deployed and the last
  # good deploy stays online.
  deploy:
    needs: [branches, site]
    if: ${{ !cancelled() && needs.branches.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Downloaded by name: a missing live build fails here, and nothing is deployed.
      - uses: actions/download-artifact@v5
        with:
          name: site-live
          path: site
      # Stage artifacts contain stage/<name>/, so merging them into site/ puts each in place.
      # Without any stage there is nothing to download; that must not stop the live deploy.
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: site-stage-*
          path: site
          merge-multiple: true
      - run: ls site/stage 2>/dev/null || echo "no stages"
      - uses: actions/configure-pages@v6
      # Named per attempt: re-running a failed deploy job would otherwise find the earlier
      # attempt's "github-pages" artifact too and refuse to deploy.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
