name: Update results

on:
  schedule:
    - cron: "17 * * * *" # hourly
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Node version comes from mise.toml
      - uses: jdx/mise-action@v2
      - run: npm ci
      - run: npm test

      # data/ is not in git; it lives in the Actions cache so each run only
      # re-fetches new or unapproved Spielberichte.
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-
      - run: npm run scrape
      - run: npm run build
      # Only reached when scrape and build succeeded, so bad data is never cached.
      - uses: actions/cache/save@v4
        with:
          path: data
          key: data-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
