[tools]
# Everything else (TypeScript, tsx, cheerio) comes from package.json via `npm ci`.
node = "22"
# GitHub CLI, for repo and workflow management
gh = "2"

[tasks.install]
description = "Install npm dependencies"
run = "npm ci"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.test]
description = "Parser and stats tests"
depends = ["install"]
run = "npm test"

[tasks.typecheck]
description = "TypeScript type check"
depends = ["install"]
run = "npm run typecheck"

[tasks.scrape]
description = "Fetch nuLiga pages into data/"
depends = ["install"]
run = "npm run scrape"

[tasks.build]
description = "Render data/ into dist/"
depends = ["install"]
run = "npm run build"

[tasks.serve]
description = "Preview dist/ locally"
depends = ["build"]
run = "npm run serve"

[tasks.update]
description = "Scrape and build, like the hourly CI job"
depends = ["test"]
run = ["npm run scrape", "npm run build"]

[tasks.release]
description = "Release the current branch: check its test stage, fast-forward main, delete the branch"
run = "scripts/release.sh"

[tasks."db:migrate"]
description = "Start the local Postgres (docker compose) and apply new supabase/migrations"
run = "scripts/db-migrate.sh"

[tasks."db:reset"]
description = "Recreate the local Postgres from scratch and apply all migrations"
run = "scripts/db-migrate.sh --reset"

[tasks."db:psql"]
description = "Open psql on the local Postgres"
run = "scripts/db-migrate.sh --psql"

[tasks."db:down"]
description = "Stop the local Postgres (data is kept)"
run = "docker compose down || docker-compose down"

[tasks."db:admin"]
description = "Create a local user with this email (if missing) and make it admin: mise run db:admin me@example.org"
run = "scripts/db-admin.sh"
